apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: platform-demo-ingress
  namespace: platform-demo
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - app.local
      secretName: platform-demo-tls-secret
  rules:
    - host: app.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: platform-demo-service
                port:
                  number: 80
