apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: platform-demo-eks
  region: us-east-1
  version: "1.30"

availabilityZones:
  - us-east-1a
  - us-east-1b

vpc:
  nat:
    gateway: Disable
  clusterEndpoints:
    publicAccess: true
    privateAccess: false

managedNodeGroups:
  - name: platform-demo-ng
    instanceType: t3.small
    desiredCapacity: 2
    minSize: 2
    maxSize: 3
    volumeSize: 20
    privateNetworking: false
    labels:
      role: worker
    tags:
      project: platform-demo
